# Runs Renovate for all repos listed in config.js.
# Every 4 hours: security fixes and Dependency Dashboard ticks are picked up quickly.
# Normal updates still wait for each repo's own schedule ("before 6am on monday"),
# and the 00:17 and 04:17 UTC runs always land inside that window.
name: Renovate

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: Log level
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: renovatebot/github-action@v46.3.13
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
